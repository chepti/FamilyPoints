name: Deploy to chepti.com/family

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # הסודות מוגדרים ב: Settings → Secrets and variables → Actions
      #   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
      #   Variables: FTP_DIR (אופציונלי, ברירת מחדל: public_html/family/)
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_DIR || 'public_html/family/' }}
          exclude: |
            **/.git*
            **/.git*/**
            README.md
