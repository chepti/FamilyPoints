name: Deploy to chepti.com/family

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: https://chepti.com/family

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # הסודות מוגדרים פעם אחת (ראו DEPLOY.md). עד אז הפריסה מדלגת בלי להיכשל.
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PATH DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::notice::Secret $v is not set, skipping deploy. See DEPLOY.md."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          case "$DEPLOY_PATH" in
            */family) ;;
            *) echo "::error::DEPLOY_PATH must end with /family (got a different folder), refusing to deploy"; exit 1 ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload over SSH
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # גרסה בכתובות הקבצים: דפדפנים ו-CDN מביאים קובץ חדש בכל פריסה
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
          grep -q "?v=${GITHUB_SHA::8}" index.html

          # רשימה סגורה של קבצים. בכוונה בלי api/config.php ובלי מחיקה של כלום בשרת.
          tar -czf - index.html sw.js manifest.webmanifest .htaccess css js icons \
              api/index.php api/config.sample.php api/.htaccess \
            | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH' --no-same-owner --no-same-permissions \
                 && find '$DEPLOY_PATH' -type d -exec chmod 755 {} + \
                 && find '$DEPLOY_PATH' -type f ! -name config.php -exec chmod 644 {} +"

      - name: Smoke test
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          V="${GITHUB_SHA::8}"
          # מה שהאתר (כולל ה-CDN) מגיש בפועל חייב להיות זהה לקבצים בריפו.
          # ה-CDN יכול להגיש גרסה ישנה כמה שניות אחרי ההעלאה, אז מנסים שוב לפני שנכשלים.
          verify() {
            local page f
            page=$(curl -fsS "$SITE_URL/") || return 1
            grep -q "js/app.js?v=$V" <<<"$page" || { echo "index.html does not reference this build yet"; return 1; }
            for f in js/app.js js/sync.js js/store.js js/art.js js/brush.js js/brushreport.js css/style.css; do
              curl -fsS "$SITE_URL/$f?v=$V" | cmp -s - "$f" || { echo "$f served by the site differs from the repo yet"; return 1; }
            done
          }
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if verify; then ok=1; break; fi
            echo "attempt $i failed, waiting for the CDN..."
            sleep 6
          done
          [ "$ok" = 1 ] || { echo "::error::the site does not serve this build (index.html or js/css differ from the repo)"; exit 1; }
          curl -fsS -o /dev/null "$SITE_URL/manifest.webmanifest"
          ping=$(curl -fsS -X POST "$SITE_URL/api/index.php?action=ping")
          echo "$ping"
          grep -q '"ok":true' <<<"$ping"
